<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · TG Forwarder</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">TG</div>
    <h2>登录控制台</h2>
    <div class="sub">TG Forwarder · Telegram 消息转发</div>

    {% if error %}
    <div class="note" style="margin-bottom:14px;color:#c0392b;background:#fdecea;border-color:#fdecea">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username" placeholder="管理员账号">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password" placeholder="登录密码">
      </div>
      <button type="submit" class="btn primary"
              style="width:100%;justify-content:center;padding:11px;font-size:14px">登录</button>
    </form>

    <div class="hint-src" style="text-align:center;margin-top:16px">
      首次部署请先到 <a href="/register">注册管理员账号</a>
    </div>
  </div>
</div>
</body>
</html>
