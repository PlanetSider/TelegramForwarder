services:
  telegram-forwarder:
    # 镜像由 GitHub Actions 自动构建并发布到 GHCR（见 .github/workflows/docker-publish.yml）
    # 首次使用前请在仓库 Packages 页面将镜像可见性改为 Public，或先执行 docker login ghcr.io
    image: ghcr.io/planetsider/telegramforwarder:latest
    # 如需本地构建而非拉取镜像，注释掉上面的 image 行并启用下面这行：
    # build: .
    container_name: telegram-forwarder
    # 如果需要使用 RSS 功能，请取消以下注释
    # ports:
    #   - 9804:8000
    restart: unless-stopped
    volumes:
      - ./db:/app/db
      - ./.env:/app/.env
      - ./logs:/app/logs
      - ./sessions:/app/sessions
      - ./temp:/app/temp
      - ./ufb/config:/app/ufb/config
      - ./config:/app/config
      - ./rss/data:/app/rss/data
      - ./rss/media:/app/rss/media
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    stdin_open: true
    tty: true

