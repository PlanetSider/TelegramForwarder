<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册管理员 · TG Forwarder</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">TG</div>
    <h2>注册管理员</h2>
    <div class="sub">这是首次部署，注册后即为唯一管理员</div>

    {% if error %}
    <div class="note" style="margin-bottom:14px;color:#b3261e;background:#fdecea;border-color:#f9d6d2">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register">
      <div class="field">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autofocus
               autocomplete="username" placeholder="登录用户名">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required
               autocomplete="new-password" placeholder="设置密码">
        <div class="hint" id="passwordRule">
          {{ password_rule or '至少 8 位，且同时包含大写字母、小写字母和数字' }}
        </div>
      </div>
      <div class="field">
        <label for="confirm">确认密码</label>
        <input type="password" id="confirm" name="confirm_password" required
               autocomplete="new-password" placeholder="再输入一次">
      </div>
      <button type="submit" id="submitBtn" class="btn primary"
              style="width:100%;justify-content:center;padding:11px;font-size:14px">创建账号</button>
    </form>

    <div class="hint-src" style="text-align:center;margin-top:16px">
      已有账号？<a href="/login">返回登录</a>
    </div>
  </div>
</div>

<script>
(function () {
  var pwd = document.getElementById('password');
  var pwd2 = document.getElementById('confirm');
  var btn = document.getElementById('submitBtn');
  var hint = document.getElementById('passwordRule');
  var baseColor = hint.style.color;

  function passwordOk(v) {
    return v.length >= 8 && /[a-z]/.test(v) && /[A-Z]/.test(v) && /\d/.test(v);
  }

  function refresh() {
    var v = pwd.value;
    var v2 = pwd2.value;
    var good = passwordOk(v);
    // 已输入但不达标时提示变红
    hint.style.color = (v && !good) ? '#d93025' : baseColor;
    btn.disabled = !(good && v === v2);
  }

  pwd.addEventListener('input', refresh);
  pwd2.addEventListener('input', refresh);
  refresh();
})();
</script>
</body>
</html>
